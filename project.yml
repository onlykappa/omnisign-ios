name: OmniSign
options:
  bundleIdPrefix: org.omnisign
  deploymentTarget:
    iOS: '17.0'
packages:
  OmniCore:
    path: .
targets:
  OmniSign:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: OmniCore
        product: OmniCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.omnisign.manager
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OmniSign
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  OmniSignAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
        excludes: [Generated]
      - path: AppTests/Generated
        optional: true
        buildPhase: resources
      - path: Tests/OmniCoreTests/Fixtures/valid.ipa
        buildPhase: resources
      - path: Tests/OmniCoreTests/Fixtures/synthetic-certificate.der
        buildPhase: resources
    dependencies:
      - target: OmniSign
      - package: OmniCore
        product: OmniCore
    settings:
      base:
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.omnisign.manager.apptests
  OmniSignUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OmniSign
    settings:
      base:
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.omnisign.manager.uitests
schemes:
  OmniSign:
    build:
      targets:
        OmniSign: all
    test:
      targets: [OmniSignAppTests, OmniSignUITests]
