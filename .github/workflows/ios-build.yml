name: iOS experimental build
on:
  workflow_dispatch:
  push:
    branches: [feat/v1-experimental, feat/v2-foundations]
    paths:
      - 'App/**'
      - 'AppTests/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'UITests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'project.yml'
      - 'scripts/test.sh'
      - 'scripts/fixtures.py'
      - 'scripts/select-simulator.py'
      - 'scripts/generate-test-identity.py'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false # Preserve evidence from active tests; queue only the latest source checkpoint.
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record build environment
        run: |
          mkdir -p build-evidence
          xcodebuild -version | tee build-evidence/xcode.txt
          swift --version | tee build-evidence/swift.txt
          xcrun --sdk iphoneos --show-sdk-version | tee build-evidence/iphoneos-sdk.txt
      - name: Test portable core and inspection CLI
        run: |
          set -o pipefail
          scripts/test.sh 2>&1 | tee build-evidence/core-tests.log
      - name: Install project generator
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version | tee build-evidence/xcodegen.txt
      - name: Generate project and resolve dependencies
        run: |
          set -o pipefail
          python3 scripts/generate-test-identity.py
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project OmniSign.xcodeproj -scheme OmniSign 2>&1 | tee build-evidence/resolve.log
      - name: Compile for Simulator
        run: |
          set -o pipefail
          xcodebuild -project OmniSign.xcodeproj -scheme OmniSign -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData/Simulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-evidence/simulator-build.log
      - name: Run Simulator app smoke test
        run: |
          set -o pipefail
          python3 scripts/select-simulator.py > build-evidence/simulator-id.txt
          simulator_id="$(cat build-evidence/simulator-id.txt)"
          xcodebuild -project OmniSign.xcodeproj -scheme OmniSign -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath DerivedData/Simulator -resultBundlePath build-evidence/SimulatorTests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee build-evidence/simulator-tests.log
      - name: Export Simulator screenshots
        if: always()
        run: |
          if [ -d build-evidence/SimulatorTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build-evidence/SimulatorTests.xcresult --output-path build-evidence/screenshots
          fi
      - name: Compile unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild -project OmniSign.xcodeproj -scheme OmniSign -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData/Device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-evidence/device-build.log
      - name: Package unsigned bootstrap IPA
        run: |
          mkdir -p DerivedData/Bootstrap/Payload
          cp -R DerivedData/Device/Build/Products/Release-iphoneos/OmniSign.app DerivedData/Bootstrap/Payload/
          (cd DerivedData/Bootstrap && zip -qry ../../OmniSign-UNSIGNED-experimental.ipa Payload)
          shasum -a 256 OmniSign-UNSIGNED-experimental.ipa | tee build-evidence/ipa-sha256.txt
          swift run omnisign-inspect OmniSign-UNSIGNED-experimental.ipa > build-evidence/self-inspection.json
          printf '%s\n' 'UNSIGNED EXPERIMENTAL BUILD. Requires authorized initial signing. Signing/install/refresh backends remain disabled. No physical-device acceptance has run.' > build-evidence/BUILD_STATUS.txt
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OmniSign-UNSIGNED-experimental
          path: OmniSign-UNSIGNED-experimental.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-evidence
          path: build-evidence
          if-no-files-found: error
          retention-days: 7
