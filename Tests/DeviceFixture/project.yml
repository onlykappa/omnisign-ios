name: OmniSignAcceptance
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  OmniSignAcceptance:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.omnisign.acceptance.disposable
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OmniSign Test
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  OmniSignAcceptance:
    build:
      targets:
        OmniSignAcceptance: all
